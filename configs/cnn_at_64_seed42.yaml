# configs/cnn_at_64_seed42.yaml
#
# CNN-AT-64 disambiguation experiment.
#
# The MLP at 64x64 gave broken_lcfs = 0.515. The CNN at 256x256 (3-seed
# mean of trial 142's config) gave broken_lcfs = 0.614 +/- 0.020. The
# MLP-vs-CNN comparison is confounded with resolution.
#
# This run holds CNN architecture and hyperparameters (trial 142 exactly)
# constant and changes ONLY the resolution to 64x64. Combined with the two
# additional seed YAMLs in this directory, gives a 3-seed CNN-at-64 baseline
# directly comparable to:
#   - CNN-at-256 3-seed mean: 0.614 +/- 0.020 (architecture+resolution match)
#   - MLP-at-64  single-seed: 0.515         (resolution match)
#
# If CNN-at-64 mean ~ 0.5  : resolution destroys the signal. MLP result
#                            tells us nothing about architecture class.
# If CNN-at-64 mean ~ 0.6  : architecture matters. CNN handles 64x64 fine,
#                            MLP genuinely worse for this task.

# --- Model class
model_type: cnn
decoder_upsample: nearest

# --- Architecture (trial 142 exactly)
bottleneck_dim: 240
n_enc_layers:   5     # 64 / 2^5 = 2 spatial at bottleneck. Still valid.
n_dec_layers:   3
base_channels:  45
growth_factor:  2.420701279177553
use_batchnorm:  true

# --- Preprocessing (trial 142 exactly)
use_hpf:   true
hpf_sigma: 1.0150899986921562

# --- Training (trial 142 exactly)
lr:         0.00022215300717804413
batch_size: 24
max_epochs: 300
min_epochs: 30
patience:   30

# --- Reproducibility
seed:          42
deterministic: false

# --- Paths
manifests_dir: /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/manifests
images_root:   /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/AEModel_jy_screenshots

# --- Resolution (THIS is the change vs trial 142)
crop_box:   [72, 28, 300, 500]
image_size: 64

# --- Score calibration
score_k: 37.0

# --- Output
output_dir: cnn_at_64_outputs