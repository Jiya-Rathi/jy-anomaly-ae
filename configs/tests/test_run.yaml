# test_run.yaml
# End-to-end sanity-check for train.py.
# Small architecture, short training -- not meant to produce good AUCs.

# --- Architecture (small, fast)
bottleneck_dim: 32
n_enc_layers:  3
n_dec_layers:  2
base_channels: 16
growth_factor: 2.0
use_batchnorm: true

# --- Preprocessing
use_hpf:   false
hpf_sigma: 3.0

# --- Training (short)
lr:         1.0e-3
batch_size: 32
max_epochs: 10
min_epochs: 3
patience:   5

# --- Reproducibility
seed:          42
deterministic: false

# --- Paths
manifests_dir: /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/manifests
images_root:   /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/AEModel_jy_screenshots

# --- Preprocessing constants
crop_box:   [72, 28, 300, 500]
image_size: 256

# --- Score calibration
score_k: 37.0

output_dir: test_outputs