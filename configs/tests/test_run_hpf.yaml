# test_run_hpf.yaml
# Same as test_run.yaml but with HPF enabled.
# Expected behavior: broken_lcfs AUC should improve significantly
# vs the non-HPF baseline (based on the previous 100-epoch ablation,
# roughly +13pp).

# --- Architecture (same as non-HPF test)
bottleneck_dim: 32
n_enc_layers:  3
n_dec_layers:  2
base_channels: 16
growth_factor: 2.0
use_batchnorm: true

# --- Preprocessing (HPF ON)
use_hpf:   true
hpf_sigma: 3.0

# --- Training
lr:         1.0e-3
batch_size: 32
max_epochs: 10
min_epochs: 3
patience:   5

# --- Reproducibility
seed:          42
deterministic: false

# --- Paths
manifests_dir: /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/manifests
images_root:   /mnt/beegfs/mantis/jrathi/AE_Model_Thesis/AEModel_jy_screenshots

# --- Preprocessing constants
crop_box:   [72, 28, 300, 500]
image_size: 256

# --- Score calibration
score_k: 37.0

output_dir: test_outputs